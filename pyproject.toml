    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.22",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
